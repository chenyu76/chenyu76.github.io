<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Sequence Game</title>
    <style>
      :root {
        --bg-color: #1e1e24;
        --slot-bg: #2b2b36;
        --highlight: #ffffff;
        --success: #4ade80;
        --fail: #f87171;
        /* Game Colors */
        --c0: #ef476f; /* Red */
        --c1: #ffd166; /* Yellow */
        --c2: #06d6a0; /* Green */
        --c3: #118ab2; /* Blue */
        --c4: #9d4edd; /* Purple */
        --c5: #ff9f1c; /* Orange */
      }

      body {
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        overflow: hidden;
        user-select: none;
      }

      /* Icons */
      svg {
        width: 24px;
        height: 24px;
        fill: white;
      }

      #game-board {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 1;
        transition: opacity 0.3s;
      }

      .row.disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .slots-container {
        display: flex;
        gap: 8px;
        padding: 8px;
        background: var(--slot-bg);
        border-radius: 12px;
      }

      .slot {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        background-color: #3f3f4e;
        cursor: pointer;
        transition:
          transform 0.1s,
          border 0.1s;
        border: 3px solid transparent;
      }

      .slot.active {
        border-color: var(--highlight);
        transform: scale(1.05);
      }

      /* Color classes */
      .color-0 {
        background-color: var(--c0);
      }
      .color-1 {
        background-color: var(--c1);
      }
      .color-2 {
        background-color: var(--c2);
      }
      .color-3 {
        background-color: var(--c3);
      }
      .color-4 {
        background-color: var(--c4);
      }
      .color-5 {
        background-color: var(--c5);
      }

      /* Feedback Indicators */
      .feedback {
        display: flex;
        gap: 4px;
        width: 40px; /* fixed width for layout stability */
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #3f3f4e;
      }

      .dot.correct {
        background-color: var(--success);
        box-shadow: 0 0 5px var(--success);
      }

      /* Controls Area */
      #controls {
        margin-top: 20px;
        display: flex;
        gap: 20px;
      }

      .btn {
        background: var(--slot-bg);
        border: none;
        padding: 12px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }

      .btn:hover {
        background: #3f3f4e;
      }
      .btn:active {
        transform: scale(0.95);
      }

      /* Overlay for Win/Lose */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
      }

      #overlay.show {
        visibility: visible;
        opacity: 1;
      }

      #result-icon svg {
        width: 80px;
        height: 80px;
      }
      .win-color {
        fill: var(--success);
      }
      .lose-color {
        fill: var(--fail);
      }

      #answer-reveal {
        display: flex;
        gap: 10px;
        margin: 30px 0;
      }

      .top-bar {
        position: absolute;
        top: 20px;
        right: 20px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <button class="btn" onclick="initGame()" title="Reset">
        <svg viewBox="0 0 24 24">
          <path
            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
          />
        </svg>
      </button>
    </div>

    <div id="game-board"></div>

    <div id="input-area" style="margin-top: 15px">
      <div class="row">
        <div class="slots-container" id="current-slots">
          <div class="slot active" onclick="selectSlot(0)"></div>
          <div class="slot" onclick="selectSlot(1)"></div>
          <div class="slot" onclick="selectSlot(2)"></div>
          <div class="slot" onclick="selectSlot(3)"></div>
        </div>
        <button class="btn" onclick="submitGuess()" id="submit-btn">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
          </svg>
        </button>
      </div>
    </div>

    <div id="overlay">
      <div id="result-icon"></div>
      <div id="answer-reveal"></div>
      <button class="btn" onclick="initGame()">
        <svg viewBox="0 0 24 24">
          <path
            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
          />
        </svg>
      </button>
    </div>

    <script>
      // Game Constants
      const COLORS_COUNT = 4; // Total available colors
      const SEQUENCE_LENGTH = 4;
      const MAX_ATTEMPTS = 8;

      // State
      let secretSequence = [];
      let currentGuess = [null, null, null, null];
      let attemptsCount = 0;
      let activeSlotIndex = 0;
      let isGameOver = false;

      // DOM Elements
      const board = document.getElementById("game-board");
      const currentSlots = document.querySelectorAll("#current-slots .slot");
      const overlay = document.getElementById("overlay");
      const resultIcon = document.getElementById("result-icon");
      const answerReveal = document.getElementById("answer-reveal");

      function initGame() {
        // Reset State
        secretSequence = generateSequence();
        currentGuess = [null, null, null, null];
        attemptsCount = 0;
        activeSlotIndex = 0;
        isGameOver = false;

        // Reset UI
        board.innerHTML = ""; // Clear history
        overlay.classList.remove("show");
        updateCurrentRowUI();

        // Generate empty slots for history visualization
        // Optional: we could pre-render empty rows, but dynamic is fine.
      }

      function generateSequence() {
        let pool = Array.from({ length: COLORS_COUNT }, (_, i) => i);
        let sequence = [];
        // Fisher-Yates shuffle for uniqueness
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, SEQUENCE_LENGTH);
      }

      function selectSlot(index) {
        if (isGameOver) return;
        activeSlotIndex = index;

        // Handle color cycling on click if already selected
        // But logic says: Click to select. If we want click to cycle, we check if active.
        // Let's keep it simple: Click sets focus. If you click again, it cycles.
        if (document.activeElement !== document.body) document.body.focus();

        updateCurrentRowUI();
      }

      // Enhanced Click Logic: Cycle color if clicking the active slot
      currentSlots.forEach((slot, index) => {
        slot.addEventListener("click", () => {
          if (activeSlotIndex === index) {
            cycleColor(1);
          } else {
            activeSlotIndex = index;
            updateCurrentRowUI();
          }
        });
      });

      function cycleColor(direction) {
        let val = currentGuess[activeSlotIndex];
        if (val === null) {
          val = 0;
        } else {
          val = (val + direction + COLORS_COUNT) % COLORS_COUNT;
        }
        currentGuess[activeSlotIndex] = val;
        updateCurrentRowUI();
      }

      function updateCurrentRowUI() {
        currentSlots.forEach((slot, index) => {
          // Clear classes
          slot.className = "slot";
          if (index === activeSlotIndex) slot.classList.add("active");

          // Set color
          if (currentGuess[index] !== null) {
            slot.classList.add(`color-${currentGuess[index]}`);
          }
        });
      }

      function submitGuess() {
        if (isGameOver) return;
        // Validate: All slots must be filled
        if (currentGuess.includes(null)) {
          // Shake animation or visual feedback could go here
          return;
        }

        // Check logic
        let correctPosition = 0;
        for (let i = 0; i < SEQUENCE_LENGTH; i++) {
          if (currentGuess[i] === secretSequence[i]) {
            correctPosition++;
          }
        }

        // Create History Row
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";

        const slotsDiv = document.createElement("div");
        slotsDiv.className = "slots-container";

        currentGuess.forEach((color) => {
          const s = document.createElement("div");
          s.className = `slot color-${color}`;
          s.style.cursor = "default";
          slotsDiv.appendChild(s);
        });

        // Feedback Dots
        const feedbackDiv = document.createElement("div");
        feedbackDiv.className = "feedback";
        for (let i = 0; i < SEQUENCE_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "dot";
          if (i < correctPosition) dot.classList.add("correct");
          feedbackDiv.appendChild(dot);
        }

        rowDiv.appendChild(slotsDiv);
        rowDiv.appendChild(feedbackDiv);
        board.appendChild(rowDiv);

        // Scroll to bottom
        window.scrollTo(0, document.body.scrollHeight);

        attemptsCount++;

        // Win Condition
        if (correctPosition === SEQUENCE_LENGTH) {
          endGame(true);
        } else if (attemptsCount >= MAX_ATTEMPTS) {
          endGame(false);
        } else {
          // Clear input for next turn? Or keep it?
          // Prompt says: "保留在屏幕上" (History kept).
          // Usually input stays to modify easily. Let's keep input but focus first slot.
          // activeSlotIndex = 0;
          // updateCurrentRowUI();
        }
      }

      function endGame(win) {
        isGameOver = true;
        setTimeout(() => {
          overlay.classList.add("show");

          // Icon
          if (win) {
            resultIcon.innerHTML =
              '<svg class="win-color" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>';
          } else {
            resultIcon.innerHTML =
              '<svg class="lose-color" viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>';
          }

          // Show Answer
          answerReveal.innerHTML = "";
          if (!win) {
            secretSequence.forEach((color) => {
              const s = document.createElement("div");
              s.className = `slot color-${color}`;
              answerReveal.appendChild(s);
            });
          }
        }, 500);
      }

      // Keyboard Controls
      document.addEventListener("keydown", (e) => {
        if (isGameOver) return;

        switch (e.key) {
          case "ArrowLeft":
            activeSlotIndex =
              (activeSlotIndex - 1 + SEQUENCE_LENGTH) % SEQUENCE_LENGTH;
            updateCurrentRowUI();
            break;
          case "ArrowRight":
            activeSlotIndex = (activeSlotIndex + 1) % SEQUENCE_LENGTH;
            updateCurrentRowUI();
            break;
          case "ArrowUp":
            cycleColor(1);
            break;
          case "ArrowDown":
            cycleColor(-1);
            break;
          case "Backspace":
            currentGuess[activeSlotIndex] = null;
            updateCurrentRowUI();
            break;
          case "Enter":
            submitGuess();
            break;
        }
      });

      // Initialize on load
      initGame();
    </script>
  </body>
</html>
