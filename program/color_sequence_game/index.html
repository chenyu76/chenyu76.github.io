<!doctype html>
<html lang="zh-CN">

      <button
        class="btn btn-in-menu hidden"
        onclick="increaseSlotsLength(-1)"
        title="Minus"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="M200-440v-80h560v80H200Z" />
        </svg>
      </button>
      <button
        class="btn btn-in-menu hidden"
        onclick="increaseSlotsLength(1)"
        title="Plus"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />

        onclick="endGame(false)"

    <div id="main-area">
      <div id="game-board"></div>

      <div id="input-area" style="margin-top: 15px">
        <div class="row">
          <div class="slots-container" id="current-slots"></div>
          <button class="btn" onclick="submitGuess()" id="submit-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
              <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="overlay">
      <div id="result-icon"></div>
      <div id="answer-reveal"></div>
      <button class="btn" onclick="initGame()">
        <svg viewBox="0 0 24 24">
          <path
            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
          />
        </svg>
      </button>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
