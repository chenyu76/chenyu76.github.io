<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PDF to PPT Converter</title>

	<link rel="icon" href="./icon.png" type="image/png" />
	<link rel="stylesheet" href="./styles.css" />
</head>

<body>

	<div id="drop-container" class="container">
		<p class="info-text">
			Convert .pdf to .pptx.
		</p>
		<p class="info-text">Resolution: <input style="max-width: 70px;" class="info-text" type="text"
				id="resolution-input" placeholder="2560">px
		</p>
		<label for="pdf-input" id="upload-label" class="upload-btn">
			Choose PDF
		</label>
		<input type="file" id="pdf-input" accept=".pdf">
		<p class="info-text" id="info-text-downloaded">
		</p>
		<p class="info-text">
			Drag & drop or click to select a .pdf file.
			<br>
			This converter converts each page of PDF into a picture and puts it into PPT, so the content
			cannot be
			edited directly, but the PDF style can be perfectly preserved.
			<br>
			Powered by <a href="https://mozilla.github.io/pdf.js/" target="_blank">PDF.js</a> & <a
				href="https://gitbrent.github.io/PptxGenJS/" target="_blank">PptxGenJS</a>.
			<br>
			<!-- This page is generated by Google Gemini. -->
		</p>
	</div>

	<script src="https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
	<script src="https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
	<script src="./script.js"></script>
</body>

</html>
