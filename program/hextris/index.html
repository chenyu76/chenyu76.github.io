<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>六边形网格动态可视化</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<div class="container" height="100%">
		<div id="grid-container"></div>

		<div class="controls">
			<div class="control-group">
				<div class="slider-container">
					<label for="zoom">缩放级别: <span id="zoom-value">1.00</span></label>
					<input type="range" id="zoom" min="0.1" max="3" step="0.05" value="1">
				</div>

				<div class="slider-container">
					<label for="animation">动画速度: <span id="speed-value">0.7s</span></label>
					<input type="range" id="animation" min="0.1" max="2" step="0.1" value="0.7">
				</div>

				<div class="buttons">
					<button id="reset">重置视图</button>
				</div>
			</div>
			<div class="control-group">
				<p>测试</p>
			</div>

		</div>
	</div>

	<script src="script.js"></script>
</body>

</html>
