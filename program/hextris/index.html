<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hextris</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <div class="overlay-content" style="max-width: 480px">
        <h1>Hextris</h1>
        <div id="tutorial-diagram"></div>
        <p id="tutorial-text"></p>
        <div id="tutorial-diagram2"></div>
        <p id="tutorial-text2"></p>
        <button id="start-settings-btn">Settings</button>
        <button id="start-btn">Start Game</button>
      </div>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen" class="overlay hidden">
      <div class="overlay-content">
        <h1>Settings</h1>
        <div class="setting">
          <label>Blocks: <span id="settings-blocks-value">6</span></label>
          <input type="range" id="settings-blocks" min="4" max="12" value="6" />
        </div>
        <div class="setting">
          <label
            >Drop Speed: <span id="settings-speed-value">1250ms</span></label
          >
          <input
            type="range"
            id="settings-drop-speed"
            min="300"
            max="2000"
            step="50"
            value="1250"
          />
        </div>
        <div class="setting">
          <label
            >Height Limit: <span id="settings-height-value">30</span></label
          >
          <input
            type="range"
            id="settings-height"
            min="10"
            max="60"
            value="30"
          />
        </div>
        <div class="setting">
          <label>Zoom: <span id="settings-zoom-value">1.00</span></label>
          <input
            type="range"
            id="settings-zoom"
            min="0.1"
            max="3"
            step="0.05"
            value="1"
          />
        </div>
        <div class="setting">
          <label>Anim Speed: <span id="settings-anim-value">0.3s</span></label>
          <input
            type="range"
            id="settings-animation"
            min="0"
            max="2"
            step="0.1"
            value="0.3"
          />
        </div>
        <div class="setting">
          <button id="settings-bgm">Play BGM</button>
        </div>
        <p id="settings-notice">Some Settings require restart to apply.</p>
        <button id="settings-restart">Restart Game</button>
        <button id="settings-back">Back</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="end-screen" class="overlay hidden">
      <div class="overlay-content">
        <h2>Game Over</h2>
        <p>Score: <span id="end-score">0</span></p>
        <button id="restart-btn">Restart</button>
      </div>
    </div>

    <div class="container">
      <div id="grid-container"></div>

      <div class="controls">
        <div class="control-group" style="text-align: center">
          <label>Score</label>
          <span id="score" style="font-size: 2em; color: #333">0</span>
        </div>

        <div class="control-group">
          <div class="buttons">
            <button id="reset">Reset View</button>
          </div>

          <div class="buttons">
            <button id="sidebar-settings-btn">Settings</button>
          </div>
        </div>

        <div class="control-group">
          <div class="game-buttons">
            <button id="btn-rotl">&#8634;</button>
            <button id="btn-left">&#9664;</button>
            <button id="btn-down">&#9660;</button>
            <button id="btn-right">&#9654;</button>
            <button id="btn-rotr">&#8635;</button>
          </div>
        </div>
      </div>
    </div>

    <script src="tutorial.js"></script>
    <script src="game.js"></script>
    <script src="sound.js"></script>
    <script src="hextris.js"></script>
    <script src="script.js"></script>
  </body>
</html>
