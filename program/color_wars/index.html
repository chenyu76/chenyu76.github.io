<!doctype html>
<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <title>Color War</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div class="top-left-controls">
        <button id="restartButton" class="control-button" title="重玩">
          🔄
        </button>
        <button id="settingsButton" class="control-button" title="设置">
          ⚙️
        </button>
      </div>
    </header>
    <main>
      <div id="game-board"></div>
    </main>
    <footer></footer>

    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>游戏设置</h2>

        <p>任何更改都会重新开始一局新游戏</p>

        <div class="modal-section">
          <label for="playerCount">玩家人数:</label>
          <select id="playerCount">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>

        <div class="modal-section">
          <label for="gameMap">游戏地图:</label>
          <select id="gameMap">
            <option value="square">正方形</option>
            <option value="hexgon">六边形</option>
            <option value="triangle">三角形</option>
            <option value="random">随机</option>
          </select>
        </div>

        <div class="modal-section">
          <label for="edgeLen">地图尺寸</label>
          <input type="range" id="edgeLen" min="20" max="100" value="50" />
          <div class="range-value">
            当前值: <span id="edgeLenValue">50</span>
          </div>
        </div>

        <button id="saveSettings" class="save-settings-button">保存设置</button>
      </div>
    </div>

    <script src="./script.js" defer></script>
  </body>
</html>
