        <div id="content"><p><a href="https://github.com/chenyu76/wheelOfFortune">仓库地址</a></p>
<p>通过文件保存转盘上的可选项，默认读取当前目录下.md文件，如果没有会弹出文件选择框。</p>
<p>转盘上的按钮可点击显示不同的自定义内容。</p>
<h2>转盘选项规范：</h2>
<p>有两种写法：</p>
<h3>1</h3>
<p>每行代表一个转盘选项，点击转盘选项没有有效内容。</p>
<h3>2</h3>
<p>每个 <code># </code> 开头的此行内容代表一个转盘选项，其后直到下一个 <code># </code> 都被视为转盘选项的详情，可以通过点击转盘上该选项的文字查看。</p>
<h1>web version</h1>
<p>似乎web版无法读取本地文件，但仍可以通过手动输入粘贴文件内容代替</p>
