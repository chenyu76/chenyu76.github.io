<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>像素图背景</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="pixel-art">
    <div id="pixel-art-background"></div>
    <div id="pixel-art-midground"></div>
    <div id="pixel-art-foreground"></div>
  </div>
  <script src="imgMatrix.js"></script>
  <script src="sky_element.js"></script>
  <script src="land.js"></script>
  <script src="pampas_grass.js"></script>
  <script src="script.js"></script>
  <script>
    imgInit();
    // 每隔十分钟更新背景
    setInterval(imgInit, 600000);

    // 防抖函数
    function debounce(func, delay = 250) {
      let timeoutId;
      return (...args) => {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {func.apply(this, args);}, delay);
      };
    }

    // 处理窗口大小变化
    function handleResize() {
      if (typeof is_first_img_init !== 'undefined')
        is_first_img_init = true;
      imgInit();
    }
    const debouncedResize = debounce(handleResize, 300);
    window.addEventListener("resize", debouncedResize);
  </script>
</body>

</html>
