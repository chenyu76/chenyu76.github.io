<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素图背景</title>
    <style>
      STYLE_PLACEHOLDER
    </style>
  </head>

  <body>
    <div id="pixel-art">
      <div id="pixel-art-background"></div>
      <div id="pixel-art-midground"></div>
      <div id="pixel-art-foreground"></div>
    </div>
    <script>
      SCRIPT_PLACEHOLDER;

      var currentPixelTheme = null;
      function applyPixelArtTheme(theme) {
        if (currentPixelTheme === theme) return;
        currentPixelTheme = theme;
        var isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var bg = document.getElementById('pixel-art-background');
        if (bg) bg.style.backgroundColor = isDark ? '#1e1e2e' : '#f0f0f0';
        if (isDark) {
          imgInit(document.documentElement.clientHeight,
                  Math.random() < 0.5 ? Math.random() * 5 : 20 + Math.random() * 4);
        } else {
          imgInit();
        }
      }

      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'theme') {
          applyPixelArtTheme(event.data.theme);
        }
      });

      try {
        applyPixelArtTheme(parent.document.documentElement.getAttribute('data-theme') || 'light');
      } catch(e) {
        applyPixelArtTheme('light');
      }

      // 防抖函数
      function debounce(func, delay = 250) {
        let timeoutId;
        return (...args) => {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => {
            func.apply(this, args);
          }, delay);
        };
      }

      let imgLastSeenSize = {
        width: document.documentElement.clientWidth,
        height: document.documentElement.clientHeight,
      };
      // 处理窗口大小变化
      function handleResize() {
        // 在开关 display:none 时，不触发重新绘制
        if (
          document.documentElement.clientHeight == 0 ||
          document.documentElement.clientWidth == 0
        )
          return;
        if (
          imgLastSeenSize.width == document.documentElement.clientWidth &&
          imgLastSeenSize.height == document.documentElement.clientHeight
        )
          return;
        imgLastSeenSize.width = document.documentElement.clientWidth;
        imgLastSeenSize.height = document.documentElement.clientHeight;

        // if (typeof is_first_img_init !== "undefined") is_first_img_init = true;
        imgInit();
      }
      const debouncedResize = debounce(handleResize, 300);
      window.addEventListener("resize", debouncedResize);
    </script>
  </body>
</html>
