<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素文字渲染测试</title>
    <style>
      body {
        margin: 20px;
        background: #f0f0f0;
        font-family: monospace;
      }
      canvas {
        border: 1px solid #ccc;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .info {
        margin: 8px 0;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="info" id="info"></div>
    <canvas id="pixel-canvas"></canvas>

    <script src="pixel_text_renderer.js"></script>
    <script src="glyph_data.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById('pixel-canvas');
        const infoEl = document.getElementById('info');

        if (typeof PIXEL_GLYPH_DATA === 'undefined') {
          infoEl.textContent = '未找到 PIXEL_GLYPH_DATA，请先运行 Python 脚本生成 glyph_data.js';
          return;
        }

        const renderer = new PixelTextRenderer({
          canvas: canvas,
          pixelSize: 2,
          fillColor: '#222'
        });

        // 渲染所有 indexLists
        const lists = PIXEL_GLYPH_DATA.indexLists;
        if (lists.length === 0) {
          infoEl.textContent = 'indexLists 为空';
          return;
        }

        // 合并所有 list，用 -1 换行分隔
        const combined = [];
        for (let i = 0; i < lists.length; i++) {
          if (i > 0) combined.push(-1);
          combined.push(...lists[i]);
        }

        renderer.render(combined);

        const totalChars = combined.filter(c => c !== -1).length;
        const lines = combined.filter(c => c === -1).length + 1;
        infoEl.textContent =
          `渲染完成: ${totalChars} 个字符, ${lines} 行, ` +
          `画布 ${canvas.width}x${canvas.height}`;
      })();
    </script>
  </body>
</html>
