<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATLAB Test</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.png" type="image/png" />
  </head>
  <body>
    <div class="container">
      <div id="quiz-container">
        <div class="header">
          <span id="progress">1/1</span>
        </div>
        <div id="question-area">
          <div id="question-text" class="question"></div>
          <div id="options-container" class="options"></div>
          <div id="explanation-area" class="explanation hidden"></div>
        </div>
        <div class="navigation">
          <button id="prev-btn" disabled>Previous</button>
          <button id="next-btn">Next</button>
        </div>
      </div>

      <div id="summary-container" class="hidden">
        <h2>Test Ended</h2>
        <p id="score-text"></p>
        <p>
          Code in the questions are tested in MATLAB 2023b. There is no
          guarantee of consistency in different version of MATLAB.
        </p>
        <button onclick="location.reload()">Restart</button>
      </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
