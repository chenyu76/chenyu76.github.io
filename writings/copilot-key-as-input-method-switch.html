          <div class="content-wrapper">
            <div class="content"><p>我一直苦恼该用哪个键切换中英文。键盘上全是键，但每个键都有它自己的功能。我把哪一个拿来改成中英文切换，都像是在拆东墙补西墙——直到我发现我新换的笔记本键盘上多了一个Copilot键，这个键一点用也没有，正正好用来切换中英文。</p>
<h2 id="h2-u6ce8">注</h2><ul>
<li>在Windows上，你可以通过<a href="https://github.com/microsoft/powertoys">powertoys</a>来重映射这个键。</li>
<li>在Linux上，这个键按下本来就没有效果，可以直接映射到切换输入法。</li>
</ul>
</div>
