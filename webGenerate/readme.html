<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站编译流程</title>

  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.png" type="image/png" />

  
</head>

<body>
  <iframe id="iframe-background" src="/img/pixelart/index.html" title="background"></iframe>

  <div id="title-container">
    <div id="spacer"></div>
    <div id="top-buttons-wrapper" class="top-buttons">
      <a href="/toc.html" title="文档索引" class="fade-in"><img src="/img/icon/folder.svg" alt="Toc" class="icon" /></a><a
        href="/index.html" title="返回主页" class="fade-in"><img src="/img/icon/home.svg" alt="Home" class="icon" /></a><a
        href="https://github.com/chenyu76" target="_blank" title="跳转到 GitHub" class="fade-in"><img
          src="/img/icon/github.svg" alt="Github" class="icon" /></a><a href="/About.html" title="关于"
        class="fade-in"><img src="/img/icon/info.svg" alt="Info" class="icon" /></a>
    </div>
    <div id="heading"><h3>webGenerate</h3><h1>网站编译流程</h1></div>
  </div>

  <div id="anime-spacer" class="shrinked"></div>

  <div id="content-wrapper-bg">
    <div id="main-grid-container">

      <div id="left-sidebar" class="sidebar">
        <div class="sidebar-card">
          <div class="vertical-buttons">
            <a href="/toc.html" title="文档索引"><img src="/img/icon/folder.svg" alt="Toc" class="icon" /></a>
            <a href="/index.html" title="返回主页"><img src="/img/icon/home.svg" alt="Home" class="icon" /></a>
            <a href="https://github.com/chenyu76" target="_blank" title="跳转到 GitHub"><img src="/img/icon/github.svg"
                alt="Github" class="icon" /></a>
            <a href="/About.html" title="关于"><img src="/img/icon/info.svg" alt="Info" class="icon" /></a>
            <button onclick="scrollToTop()" title="滚动到顶部" class="scroll-top-btn">
              <img src="/img/icon/arrow-upward.svg" alt="Return Top" class="icon" />
            </button>
          </div>
        </div>
      </div>

      <div id="content-wrapper">
        <div id="content"><p>通过Github action, 每次push上去时会通过npm调用<code>webGenerate/main.js</code>，将目录下的<code>.md</code>文件都转成<code>.html</code>,然后遍历文件夹，将这些html加入到网站目录中</p>
<h2 id="h2-githubu4ed3u5e93">Github仓库</h2><p>配置在<code>webConfig.js</code>中的仓库会被下载到对应位置。可以访问</p>
<h2 id="h2-u4e3bu9875u63a8u8350">主页推荐</h2><p>配置在<code>webConfig.js</code>中的推荐会被显示在主页上</p>
</div>
        <div id="footnote"></div>
      </div>

      <div id="right-sidebar" class="sidebar">
        <div id="toc-card" class="sidebar-card">
          <div class="toc-header">目录</div>
          <div id="toc-content">
            
          </div>
        </div>
      </div>

    </div>

    <div class="bottom-button mobile-only">
      <button onclick="scrollToTop()" title="滚动到顶部">
        <img src="/img/icon/arrow-upward.svg" alt="Return Top" class="icon" />
      </button>
    </div>
  </div>

  <script src="/script.js"></script>

  <button id="toc-mobile-btn" onclick="toggleToc()" title="目录">
    <img src="/img/icon/bookmark.svg" alt="TOC" class="icon" />
  </button>

  <div id="toc-mobile-wrapper">
    <div class="toc-header-mobile">
      <span>目录</span>
      <button onclick="toggleToc()" class="toc-close-btn">×</button>
    </div>
    <div id="toc-content-mobile"></div>
  </div>

  
</body>

</html>
