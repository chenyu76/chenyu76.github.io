<p>背景天空会根据时间变换颜色和风格，白天有☁️，晚上有✨和🌠。
在<a href="/img/pixelart/index.html">这里</a>有全屏的版本。</p>
<h2>一些有趣的技术细节</h2>
<ul>
<li>图片完全由程序生成，没有一点二进制文件</li>
<li>云是通过绘制3D球体渲染出来的</li>
<li>背景的棋盘抖动颜色是看《16bit的感动》学的（虽然动画改的剧情不好看）</li>
<li>晚上的星星和流星全是div</li>
<li>其他细节请看js源文件</li>
<li>最近可以预定天子的FUMO,感兴趣的快去下单吧！</li>
</ul>
<h2>网页内容终于不是在客户端处理的了！</h2>
<ul>
<li>python脚本换成了node.js在github上先编译好</li>
